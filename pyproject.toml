[project]
name = "google-health-to-intervals"
version = "0.1.0"
description = "Copy your Google Health (Fitbit, Pixel Watch) wellness data to intervals.icu, for free, from your own GitHub account."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "antivex" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "tzdata; sys_platform == 'win32'",
]
keywords = ["fitbit", "google-health", "intervals.icu", "wellness", "hrv", "sleep"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.scripts]
ghti = "ghti.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
