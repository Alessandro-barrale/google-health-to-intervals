name: Tests

# Runs only in the template repository itself, not in the copies made from it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen pytest -q
