name: Sync

on:
  schedule:
    # Four times a day (UTC), at odd minutes: GitHub delays jobs at full hours.
    - cron: "17 4 * * *"
    - cron: "47 9 * * *"
    - cron: "23 15 * * *"
    - cron: "53 20 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many recent days to copy"
        required: false
        default: "3"
      from:
        description: "Backfill: first day to copy (YYYY-MM-DD). Leave empty for a normal sync."
        required: false
        default: ""

permissions:
  contents: write # to save the refreshed, encrypted token in state/

concurrency:
  group: ghti-state
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
      GHTI_TIMEZONE: ${{ vars.GHTI_TIMEZONE }}
      GHTI_TOKEN_FILE: state/token.enc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Copy Google Health data to intervals.icu
        env:
          DAYS: ${{ inputs.days || '3' }}
          FROM: ${{ inputs.from }}
        run: |
          if [ -n "$FROM" ]; then
            uv run --frozen ghti backfill --from "$FROM"
          else
            uv run --frozen ghti sync --days "$DAYS" --skip-if-unconfigured
          fi

      - name: Save the encrypted token if it changed
        if: always()
        run: |
          git add -A state
          if git diff --cached --quiet; then
            echo "Token unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update encrypted Google token"
          git pull --rebase --quiet
          git push
